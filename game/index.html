<!doctype html>
<html lang="zh-Hans"><head><meta name="softserve-api-origin" content="https://awctnqjuknohysafihqn.supabase.co/functions/v1/softserve-api"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ec"><title>冰淇淋模拟器</title><meta name="author" content="kai"><meta name="description" content="按住下方区域，自由移动甜筒挤出冰淇淋。松手完成，挑战更高的冰淇淋。"><link rel="stylesheet" href="style.css?v=20261023-7"><link rel="stylesheet" href="meta.css?v=20261023-7"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='53' font-size='54'%3E🍦%3C/text%3E%3C/svg%3E"></head>
<body><main id="app" aria-label="冰淇淋模拟器">
<div class="shell" id="shell" data-phase="ready">
<header><span class="author" aria-label="作者：kai">kai</span><select id="language" aria-label="语言"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh" selected>简体中文</option></select></header>
<div class="scene" id="scene"><canvas id="game" aria-label="甜筒和冰淇淋的3D画面"></canvas></div>
<div class="height-card" id="heightCard"><strong id="height" aria-label="高度">0.0 cm</strong></div>
<div id="operation" class="operation" role="application" aria-label="按住并自由旋转的操作区域" tabindex="0"><svg id="guide" class="guide" aria-hidden="true"><circle id="track" class="track"/><circle id="center" class="center" r="4"/><g id="demoOrigin"><circle id="trail" class="trail" pathLength="100"/><g class="demo-finger"><path class="demo-arrow" d="M-6 15 0 23 6 15"/><circle class="demo-touch" r="11"/></g></g></svg></div>
<section id="result" class="result" aria-live="polite" hidden><h2 id="resultTitle"></h2><p class="result-score" id="scoreLine"><span id="resultNumber"></span><span id="resultUnit"> cm</span></p><div id="stars" class="stars" role="img"></div><p id="caption" class="caption"></p><p id="newBest" class="new-best" hidden></p><p class="best"><span id="bestLabel">个人最佳</span><strong id="best">—</strong></p><div class="actions"><button id="retry" class="primary"><span id="retryLabel">再玩一次</span><span aria-hidden="true">↻</span></button><button id="share" class="secondary"><span id="shareLabel">分享</span><span aria-hidden="true">↗</span></button></div><p id="shareNotice" class="caption" hidden></p></section>
<div id="rotate" class="blocking" role="status" hidden><span aria-hidden="true">↶</span><h2 id="rotateTitle">请竖屏游玩</h2><p id="rotateText">请将手机竖直放置</p></div>
</div></main>
<dialog id="shareChooser" aria-labelledby="shareTitle"><div class="dialog-body"><h2 id="shareTitle" tabindex="-1" autofocus>分享形式</h2><button id="shareImage" class="secondary share-option"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg><span>分享图片</span></button><button id="shareVideo" class="secondary share-option" hidden><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 8 6 4-6 4Z" fill="currentColor" stroke="none"/></svg><span>分享视频</span></button><form method="dialog"><button class="cancel">× <span id="cancelLabel">取消</span></button></form></div></dialog>
<script type="module" src="game.js?v=20261023-7"></script></body></html>
